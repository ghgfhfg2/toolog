<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="icon" type="image/x-icon" href="{{ '/favicon.ico' | relative_url }}">
<link rel="icon" type="image/x-icon" sizes="16x16" href="{{ '/favicon-16x16.ico' | relative_url }}">
<link rel="icon" type="image/x-icon" sizes="32x32" href="{{ '/favicon-32x32.ico' | relative_url }}">
<link rel="icon" type="image/x-icon" sizes="48x48" href="{{ '/favicon-48x48.ico' | relative_url }}">
<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
{% if page.alternate_urls %}
{% assign alt = page.alternate_urls %}
{% if alt.ko %}<link rel="alternate" hreflang="ko" href="{{ alt.ko | absolute_url }}">{% endif %}
{% if alt.en %}<link rel="alternate" hreflang="en" href="{{ alt.en | absolute_url }}">{% endif %}
{% if alt.ja %}<link rel="alternate" hreflang="ja" href="{{ alt.ja | absolute_url }}">{% endif %}
{% if alt.en and alt.ja and alt.ko %}<link rel="alternate" hreflang="x-default" href="{{ alt.ko | absolute_url }}">{% endif %}
{% endif %}
