{%- assign header_lang = page.lang | default: 'ko' -%}
<header class="site-header" role="banner">
  <div class="wrapper site-header__inner">
    <a class="site-title" rel="author" href="{% if header_lang == 'en' %}{{ '/en/' | relative_url }}{% elsif header_lang == 'ja' %}{{ '/ja/' | relative_url }}{% else %}{{ '/' | relative_url }}{% endif %}" aria-label="Toolog home">
      <span class="brand-mark" aria-hidden="true">T</span>
      <span class="brand-word">Toolog</span>
    </a>
    <nav class="site-nav" aria-label="{% if header_lang == 'en' %}Primary navigation{% elsif header_lang == 'ja' %}メインナビゲーション{% else %}주요 메뉴{% endif %}">
      <div class="site-nav__links">
        <a class="page-link" href="{% if header_lang == 'en' %}{{ '/en/' | relative_url }}{% elsif header_lang == 'ja' %}{{ '/ja/' | relative_url }}{% else %}{{ '/' | relative_url }}{% endif %}">{% if header_lang == 'en' %}Tools{% elsif header_lang == 'ja' %}ツール{% else %}도구 찾기{% endif %}</a>
        <a class="page-link page-link--about" href="{{ '/about/' | relative_url }}">{% if header_lang == 'en' %}About{% elsif header_lang == 'ja' %}紹介{% else %}소개{% endif %}</a>
      </div>
      <div class="language-nav" aria-label="Language">
        <a href="{{ '/' | relative_url }}"{% if header_lang == 'ko' %} aria-current="page"{% endif %}>KO</a>
        <a href="{{ '/en/' | relative_url }}"{% if header_lang == 'en' %} aria-current="page"{% endif %}>EN</a>
        <a href="{{ '/ja/' | relative_url }}"{% if header_lang == 'ja' %} aria-current="page"{% endif %}>JA</a>
      </div>
    </nav>
  </div>
</header>
